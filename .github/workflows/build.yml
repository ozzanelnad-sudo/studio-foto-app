name: Build Executable Application

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python mediapipe customtkinter Pillow pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed app.py

    - name: Upload Application Package
      uses: actions/upload-artifact@v4
      with:
        name: Studio_Pas_Foto_App
        path: dist/app/*
